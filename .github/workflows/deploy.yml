name: Aggiorna dati e pubblica

on:
  push:
    branches: [main]
  schedule:
    # Ogni 6 ore. Meteo Funghi si aggiorna una volta al giorno, ma la stazione
    # al suolo e' in tempo reale e sul sito si vede.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una pubblicazione alla volta. Non annulla quelle in corso: meglio un deploy
# in coda che un sito lasciato a meta'.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Controlli del modello
        run: |
          python scripts/growth.py
          python scripts/build_data.py --selftest

      - name: Genera i dati
        env:
          # Impostalo in Settings > Secrets and variables > Actions per
          # attivare Windy. Senza, build_data.py salta quel pezzo e va avanti.
          WINDY_KEY: ${{ secrets.WINDY_KEY }}
        run: python scripts/build_data.py

      # GitHub Pages serve gli asset con Cache-Control: max-age=600, quindi
      # per dieci minuti dopo ogni pubblicazione i browser continuano a usare
      # la copia vecchia del JavaScript. Con dati nuovi e codice vecchio si
      # ottengono guasti che sembrano bug ma sono solo cache.
      # Appendere la versione del commit rende l'indirizzo diverso a ogni
      # deploy, quindi la cache non puo' rispondere.
      # Il file HTML non ha bisogno di marcatura: e' lui a cambiare.
      - name: Marca le risorse con la versione del commit
        run: |
          V="${GITHUB_SHA::8}"
          sed -i "s#\"assets/app\.css\"#\"assets/app.css?v=$V\"#g; \
                  s#\"assets/app\.js\"#\"assets/app.js?v=$V\"#g" index.html
          sed -i "s#\"\./firebase-config\.js\"#\"./firebase-config.js?v=$V\"#g" assets/app.js
          echo "Versione risorse: $V"
          grep -o 'assets/app\.[a-z]*?v=[0-9a-f]*' index.html
          grep -o 'firebase-config\.js?v=[0-9a-f]*' assets/app.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
